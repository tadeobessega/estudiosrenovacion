<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Panel</title>
    <script>
    /* Tema: el guardado o el del sistema, como en el sitio. Va antes del CSS para no parpadear. */
    (function () { var t = null; try { t = localStorage.getItem('cer-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <link rel="icon" type="image/png" href="../assets/img/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/admin.css?v=20261111">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <button type="button" class="theme-toggle login-theme" id="themeToggle" aria-label="Cambiar el tema" title="Cambiar el tema"><i class="fas fa-sun" aria-hidden="true"></i><i class="fas fa-moon" aria-hidden="true"></i></button>
            <div class="login-logo">
                <a href="../index.html#inicio" aria-label="Centros de Estudios Renovación — inicio">
                    <img src="../assets/img/logos.png" alt="Centros de Estudios Renovación">
                </a>
            </div>

            <h1 class="login-title">Panel de administración</h1>
            <p class="login-subtitle">Ingresá tus credenciales para continuar</p>

            <div class="tab-nav">
                <button class="tab-link active" data-tab="login">Iniciar Sesión</button>
                <button class="tab-link" data-tab="register">Registrarse</button>
            </div>

            <!-- Login -->
            <div id="login-tab" class="tab-content active">
                <form id="loginForm">
                    <div id="loginError" class="alert alert-danger" style="display:none;"></div>
                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Usuario</label>
                        <input type="text" id="loginEmail" class="form-input" placeholder="tu usuario" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Contraseña</label>
                        <input type="password" id="loginPassword" class="form-input" placeholder="Tu contraseña"
                            required>
                    </div>
                    <button type="submit" class="btn-admin btn-admin-primary btn-admin-block" id="loginBtn">
                        <span class="btn-text">Iniciar Sesión</span>
                        <span class="spinner" style="display:none;"></span>
                    </button>
                </form>
                <p class="login-recuperar"><a href="#" id="abrirRecuperar">¿Perdiste el acceso?</a></p>
                <form id="recuperarForm" style="display:none;">
                    <div id="recuperarMsg" class="alert" style="display:none;"></div>
                    <p class="login-subtitle" style="margin:0 0 .75rem">Con el código de recuperación que te pasa el administrador del sitio podés poner una contraseña nueva.</p>
                    <div class="form-group"><label class="form-label" for="recUsuario">Usuario</label><input type="text" id="recUsuario" class="form-input" required></div>
                    <div class="form-group"><label class="form-label" for="recCodigo">Código de recuperación</label><input type="password" id="recCodigo" class="form-input" required autocomplete="off"></div>
                    <div class="form-group"><label class="form-label" for="recNueva">Contraseña nueva</label><input type="password" id="recNueva" class="form-input" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div>
                    <button type="submit" class="btn-admin btn-admin-primary btn-admin-block">Guardar contraseña</button>
                </form>
            </div>

            <!-- Register -->
            <div id="register-tab" class="tab-content">
                <form id="registerForm">
                    <div id="registerMessage" class="alert" style="display:none;"></div>
                    <div class="form-group">
                        <label class="form-label" for="registerEmail">Usuario</label>
                        <input type="text" id="registerEmail" class="form-input" placeholder="tu usuario" required
                            pattern="[^@\s]+" title="Un nombre de usuario, sin @ ni espacios">
                        <p style="font-size:.78rem;color:var(--muted);margin-top:.35rem;">Elegí un nombre de usuario (no un email).</p>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerPassword">Contraseña</label>
                        <input type="password" id="registerPassword" class="form-input"
                            placeholder="Mínimo 8 caracteres" required minlength="8">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="registerCentro">Centro de Investigación</label>
                        <select id="registerCentro" class="form-select" required>
                            <option value="">Selecciona tu centro</option>
                            <option value="CEER">CEER - Centro de Estudios Económicos</option>
                            <option value="CEEIR">CEEIR - Centro de Estudios Estratégicos Internacionales</option>
                            <option value="CEDHyS">CEDHyS - Centro de Estudios en Derechos Humanos y Seguridad</option>
                            <option value="OPER">OPER - Observatorio de Políticas Educativas</option>
                            <option value="OPAL">OPAL - Observatorio para el Análisis Electoral</option>
                            <option value="OPSA">OPSA - Observatorio de Política Social Aplicada</option>
                            <option value="CIREN">CIREN - Centro de Estudios Científicos</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-admin btn-admin-primary btn-admin-block" id="registerBtn">
                        <span class="btn-text">Solicitar Registro</span>
                        <span class="spinner" style="display:none;"></span>
                    </button>
                    <p style="text-align:center; margin-top:1rem; font-size:0.875rem; color:var(--admin-text-muted);">
                        Tu registro será revisado por un administrador
                    </p>
                </form>
            </div>

            <div
                style="text-align:center; margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--admin-border);">
                <a href="../index.html" class="link-text" style="font-size:0.875rem;">
                    <i class="fas fa-arrow-left"></i> Volver al sitio
                </a>
            </div>
        </div>
    </div>

    <script src="../assets/js/data-source.js?v=20261105"></script>
    <script src="../assets/js/admin-config.js?v=20261105"></script>
    <script>
        // Tabs
        document.querySelectorAll('.tab-link').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab-link').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                document.getElementById(tab.dataset.tab + '-tab').classList.add('active');
            });
        });

        // Redirect if already logged in
        if (localStorage.getItem('adminUser')) window.location.href = 'index.html';

        // Login
        document.getElementById('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('loginError');

            btn.querySelector('.btn-text').style.display = 'none';
            btn.querySelector('.spinner').style.display = 'inline-block';
            btn.disabled = true;
            errorDiv.style.display = 'none';

            try {
                const res = await apiCall('login', { email, password });
                if (res.success) {
                    localStorage.setItem('adminUser', JSON.stringify(res.user));
                    window.location.href = 'index.html';
                } else {
                    errorDiv.textContent = res.error || 'Error al iniciar sesión';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Error de conexión. Verificá tu configuración.';
                errorDiv.style.display = 'block';
            }

            btn.querySelector('.btn-text').style.display = 'inline';
            btn.querySelector('.spinner').style.display = 'none';
            btn.disabled = false;
        });

        // Register
        document.getElementById('registerForm').addEventListener('submit', async e => {
            e.preventDefault();
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const centro = document.getElementById('registerCentro').value;
            const btn = document.getElementById('registerBtn');
            const messageDiv = document.getElementById('registerMessage');

            btn.querySelector('.btn-text').style.display = 'none';
            btn.querySelector('.spinner').style.display = 'inline-block';
            btn.disabled = true;
            messageDiv.style.display = 'none';

            try {
                const res = await apiCall('register', { email, password, centro });
                if (res.success) {
                    messageDiv.className = 'alert alert-success';
                    messageDiv.textContent = res.message || 'Registro exitoso. Esperá la aprobación del administrador.';
                    messageDiv.style.display = 'block';
                    document.getElementById('registerForm').reset();
                } else {
                    messageDiv.className = 'alert alert-danger';
                    messageDiv.textContent = res.error || 'Error al registrarse';
                    messageDiv.style.display = 'block';
                }
            } catch (err) {
                messageDiv.className = 'alert alert-danger';
                messageDiv.textContent = 'Error de conexión.';
                messageDiv.style.display = 'block';
            }

            btn.querySelector('.btn-text').style.display = 'inline';
            btn.querySelector('.spinner').style.display = 'none';
            btn.disabled = false;
        });
    </script>
<script>
    document.getElementById('abrirRecuperar').addEventListener('click', function (e) { e.preventDefault(); var f = document.getElementById('recuperarForm'); f.style.display = f.style.display === 'none' ? 'block' : 'none'; });
    document.getElementById('recuperarForm').addEventListener('submit', async function (e) { e.preventDefault(); var m = document.getElementById('recuperarMsg');
      var r = await apiCall('recuperar', { email: document.getElementById('recUsuario').value, codigo: document.getElementById('recCodigo').value, nueva: document.getElementById('recNueva').value });
      m.className = 'alert ' + (r.success ? 'alert-success' : 'alert-danger'); m.textContent = r.success ? r.message : (r.error || 'No se pudo cambiar la contraseña'); m.style.display = 'block';
      if (r.success) { document.getElementById('loginEmail').value = document.getElementById('recUsuario').value; this.reset(); } });
    (function () { var b = document.getElementById('themeToggle'); if (!b) return;
      b.addEventListener('click', function () { var r = document.documentElement, n = r.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        r.setAttribute('data-theme', n); try { localStorage.setItem('cer-theme', n); } catch (e) {} }); })();
  </script>
</body>

</html>
